name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor build-essential clang cmake pkg-config libasound2-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libfontconfig1-dev libssl-dev libglib2.0-dev libatk1.0-dev libatk-bridge2.0-dev libnss3 libnspr4 libcups2 libdrm2 libgbm1 xz-utils
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Format and tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Compile GPUI desktop
        run: cargo check --locked -p broxser-desktop -j 2
      - name: Pinned Helium integration
        run: |
          bash scripts/fetch-helium.sh
          # Permit this exact downloaded binary to create its normal sandbox.
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile broxser-helium-ci "%s" flags=(unconfined) {\n  userns,\n}\n' "$PWD/.local/helium/helium" > "$RUNNER_TEMP/broxser-helium.apparmor"
          sudo apparmor_parser -r "$RUNNER_TEMP/broxser-helium.apparmor"
          BROXSER_TEST_BROWSER="$PWD/.local/helium/helium" cargo test --locked -p broxser-engine -- --ignored --nocapture
        # Keep Chromium's sandbox enabled. AppArmor/userns restrictions are a
        # runner setup failure, not permission to add --no-sandbox here.
