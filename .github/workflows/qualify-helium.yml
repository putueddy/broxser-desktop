name: Qualify Helium
# ADR 0026, decision 2: requalifies the pinned Helium against this commit and,
# when imputnet/helium-linux has a newer release (or a run names one), proposes
# and qualifies it; it also compares the pinned signing key with the one Helium
# publishes. It never changes the pin: promoting a release is a reviewed commit.
on:
  schedule:
    - cron: '23 3 * * 1' # Mondays 03:23 UTC
  workflow_dispatch:
    inputs:
      version:
        description: Helium release to qualify beside the pin (empty for the newest)
        required: false
        default: ''
  pull_request:
    paths:
      - .github/workflows/qualify-helium.yml
      - runtime/helium-linux-x86_64.json
      - runtime/helium-signing-key.asc
      - scripts/qualify-helium.py
permissions:
  contents: read
concurrency:
  group: qualify-helium-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor build-essential clang cmake pkg-config libasound2-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libfontconfig1-dev libssl-dev libglib2.0-dev libatk1.0-dev libatk-bridge2.0-dev libnss3 libnss3-tools libnspr4 libcups2 libdrm2 libgbm1 xz-utils xvfb xdotool mesa-vulkan-drivers fonts-dejavu-core
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Build the desktop and the engine tests
        run: |
          cargo build --locked -p broxser-desktop
          cargo test --locked -p broxser-engine --no-run
      - name: Let the qualified browsers create their sandbox
        # Only the browsers qualify-helium.py unpacks may create user namespaces
        # for Chromium's own sandbox, which stays enabled (as in CI).
        run: |
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile broxser-helium-qualify %s/.local/helium-candidates/*/helium flags=(unconfined) {\n  userns,\n}\n' "$PWD" > "$RUNNER_TEMP/broxser-helium-qualify.apparmor"
          sudo apparmor_parser -r "$RUNNER_TEMP/broxser-helium-qualify.apparmor"
      - name: Qualify
        env:
          VERSION: ${{ inputs.version }}
        run: |
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp &
          timeout 10 bash -c 'until [[ -S /tmp/.X11-unix/X99 ]]; do sleep 0.1; done'
          export DISPLAY=:99
          python3 scripts/qualify-helium.py scheduled ${VERSION:+--version "$VERSION"} --summary "$GITHUB_STEP_SUMMARY"
      - name: Records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helium-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/qualification/
            artifacts/helium/
          if-no-files-found: warn
          retention-days: 90
