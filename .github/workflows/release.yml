name: Release
# ADR 0025, decisions 2 and 3. A tag v<workspace version> on a commit of main
# builds and checks the archive with scripts/release-assets.sh, attests it with
# GitHub's build provenance (signed through Sigstore with this workflow's
# short-lived identity; no long-lived key), and attaches the archive, its
# .sha256, the SBOM and the attestation bundle to a draft release. Nothing is
# published: a draft is visible only to people with write access, and the owner
# decides who receives it. The archive is never a workflow artifact, which any
# signed-in GitHub user could download from this public repository. Pull
# requests that change this path build and check the assets without attesting
# or uploading them.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.sh
      - scripts/release-assets.sh
      - scripts/sbom.py
      - scripts/licenses/**
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libfontconfig1-dev libssl-dev libglib2.0-dev libatk1.0-dev libatk-bridge2.0-dev xz-utils
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Build and check the release assets (not attested, not uploaded)
        run: bash scripts/release-assets.sh

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # the draft release
      id-token: write # the Sigstore certificate of the attestation
      attestations: write # storing the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main, for the check below
          persist-credentials: false
      - name: Release only reviewed code
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main; release only a commit that main contains."
            exit 1
          fi
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev libwayland-dev libfontconfig1-dev libssl-dev libglib2.0-dev libatk1.0-dev libatk-bridge2.0-dev xz-utils
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Build and check the release assets
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-assets.sh "$TAG"
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/release/${{ github.ref_name }}/*.tar.xz
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          out=artifacts/release/$TAG
          archive=broxser-${TAG#v}-linux-x86_64.tar.xz
          cp "$BUNDLE" "$out/$archive.sigstore.json"
          gh release create "$TAG" --draft --verify-tag --title "Broxser ${TAG#v}" \
            --notes-file "$out/release-notes.md" \
            "$out/$archive" "$out/$archive.sha256" "$out/$archive.sigstore.json" \
            "$out/broxser-${TAG#v}-linux-x86_64.spdx.json"
          {
            echo "Draft release $TAG created; it stays unpublished until the owner publishes it."
            echo
            echo "\`$(cat "$out/$archive.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"
