[workspace]
members = ["crates/broxser-core", "crates/broxser-engine", "crates/broxser-cli", "crates/broxser-desktop"]
default-members = ["crates/broxser-core", "crates/broxser-engine", "crates/broxser-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
broxser-core = { path = "crates/broxser-core" }
broxser-engine = { path = "crates/broxser-engine" }
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
gpui = "=0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2"
tungstenite = "0.28"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
