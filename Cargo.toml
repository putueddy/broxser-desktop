[workspace]
members = ["crates/broxser-core", "crates/broxser-engine", "crates/broxser-cli", "crates/broxser-desktop"]
default-members = ["crates/broxser-core", "crates/broxser-engine", "crates/broxser-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
broxser-core = { path = "crates/broxser-core" }
broxser-engine = { path = "crates/broxser-engine" }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
gpui = "=0.2.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2"
tungstenite = "0.28"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.dev]
debug = 1

# Live frames are JPEG-decoded on every page update. Unoptimized decoders cost
# whole cores in the documented `cargo run` workflow.
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
