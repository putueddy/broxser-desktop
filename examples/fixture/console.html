<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broxser console fixture</title>
<!-- No favicon request, so no late 404 reaches the console after Clear. -->
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #3b82f6; }
</style>
</head>
<body>
<script>
  // By default every device reports two errors and one warning; the smoke
  // check expects each card to count them and the Console panel to show and
  // clear them.
  if (new URLSearchParams(location.search).has('selection')) {
    // Different levels let the window smoke distinguish a stale phone console
    // from the tablet's console after Hide changes the selection.
    if (innerWidth <= 400) console.error('phone console', innerWidth);
    else console.warn('other device console', innerWidth);
  } else {
    console.error('smoke error on', innerWidth);
    console.warn('smoke warning on', innerWidth);
    // A report must not keep the query or fragment of this address.
    console.error('failed at', location.href);
    // These are diagnostic strings only; no request visits these addresses.
    console.log('redaction cases',
      'http://[::1]/path?token=ipv6-secret',
      'http://éxample.test/path?token=unicode-secret',
      'https://host/photo(1).png?token=paren-secret',
      'Bearer short-secret',
      'https://host/reset/eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0In0.c2lnbmF0dXJlLXZhbHVl');
  }
  fetch('/console.html?logged');
</script>
</body>
</html>
